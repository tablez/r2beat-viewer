<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专项练习 · R2Beat</title><link rel="icon" href="./r2beat.ico"><script src="./assets/appearance.js?v=6b13131d50a3"></script><script src="./assets/keybindings.js?v=b4981bf990d0"></script><link rel="stylesheet" href="./assets/appearance.css?v=325ff93f06d1"><link rel="stylesheet" href="./assets/practice.css?v=48d02748eeb3"></head><body><main id="app" class="practice-app"><div class="practice-layout"><aside id="practice-sidebar" class="practice-sidebar"><header class="practice-heading"><div><h1>专项练习</h1></div><a href="./index.html">返回曲库</a></header><div class="practice-fold-controls" aria-label="左栏显示设置"><button id="practice-menu-toggle" class="practice-menu-toggle" aria-expanded="true" aria-controls="practice-setup">收起设置</button><button id="practice-stats-toggle" aria-expanded="true" aria-controls="practice-stats">收起成绩</button><button id="practice-judgments-toggle" aria-expanded="true" aria-controls="practice-judgments">收起判定</button><button id="practice-history-toggle" aria-expanded="true" aria-controls="practice-history-panel">收起记录</button></div><section id="practice-setup" class="practice-setup"><h2>练习设置</h2><div id="pattern-options" class="pattern-options" aria-label="选择障碍类型"></div><div class="practice-settings"><div class="practice-spacing-control" role="group" aria-label="左右桩间距"><span>左右桩间距</span><button id="practice-spacing-less" type="button" aria-label="减小左右桩间距">−</button><output id="practice-spacing-value">180%</output><button id="practice-spacing-more" type="button" aria-label="增大左右桩间距">＋</button><button id="practice-spacing-reset" type="button" title="恢复为与门两侧边缘对齐">对齐门</button></div><label>节奏 <input id="practice-bpm" type="number" min="40" max="240" step="5" value="160"> BPM</label><label>难度星级 <select id="practice-stars" title="线性预设：7 星为 1 倍，12 星为 2 倍"><option value="custom">自定义密度</option><option value="6.5">6.5 星</option><option value="7" selected>7 星（标准）</option><option value="7.5">7.5 星</option><option value="8">8 星</option><option value="8.5">8.5 星</option><option value="9">9 星</option><option value="9.5">9.5 星</option><option value="10">10 星</option><option value="10.5">10.5 星</option><option value="11">11 星</option><option value="11.5">11.5 星</option><option value="12">12 星</option></select></label><label>障碍密度 <input id="practice-density" type="range" min="0.5" max="2" step="0.05" value="1"><output id="practice-density-value">1.00×</output></label><label>每轮目标 <select id="practice-length"><option value="32">32 个障碍</option><option value="64">64 个障碍</option></select></label><label>倍速 <input id="practice-rate" type="range" min="0.5" max="1.5" step="0.1" value="1"><output id="practice-rate-value">1.0×</output></label><label><input id="practice-rhythm" type="checkbox" checked>节奏点</label><label title="0% 完全不透明，100% 完全透明；小点与合球同步调整">节奏点透明度 <input id="practice-rhythm-opacity" type="range" min="0" max="100" step="5" value="0"><output id="practice-rhythm-opacity-value">0%</output></label><label><input id="practice-click" type="checkbox" checked>节拍提示音</label><button id="practice-start" class="primary">开始练习</button><button id="practice-pause" disabled>暂停</button><button id="practice-stop" disabled>结束</button></div></section><section id="practice-stats" class="practice-stats" aria-live="polite"><div><span>当前轮次</span><b id="practice-round">—</b></div><div><span>平均判定</span><b id="practice-average">—</b><small id="practice-average-grade">等待判定</small></div><div><span>本轮成绩</span><b id="practice-score">0.00</b></div><div><span>连击</span><b id="practice-combo">0</b></div><div><span>上一轮</span><b id="practice-last">—</b></div><div><span>相比上一轮</span><b id="practice-trend" class="same">—</b></div></section><section id="practice-judgments" class="practice-details"><h2>本轮判定</h2><div id="practice-counts"></div></section><section id="practice-history-panel" class="practice-details"><h2>最近轮次</h2><ol id="practice-history"></ol></section></aside><section class="practice-play"><div class="practice-track"><canvas id="practice-canvas" aria-label="循环障碍练习谱面"></canvas><div id="practice-feedback" role="status">选择障碍类型后，点击开始</div></div></section></div><footer class="practice-footer">原查看器作者：[AG.M]夜明 · 修改部署版新增的专项练习页 · 障碍组合依据玩家提供的分类生成</footer></main><script type="module" src="./assets/practice.js?v=5fd57add1980"></script></body></html>
